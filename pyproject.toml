[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntype"
description = "Classifies the source type of Human Phenotype Ontology concepts' synonyms."
readme = "README.md"
version = "1.2.0"
# model and embedder require Python 3.10.
requires-python = ">=3.10"
authors = [{ name = "Peter Pallaoro", email = "peter.pallaoro@tum.de" }]
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.7.0",
    "adapter @ git+https://github.com/Goldkugel/adapter.git@v1.5.2",
    "embedder @ git+https://github.com/Goldkugel/embedder.git@v2.3.1",
    "model @ git+https://github.com/Goldkugel/model.git@v3.2.1",
    # 5.5.1 or newer: vLLM 0.19 excludes 5.0 to 5.5.0, which lack tokenizer
    # attributes vLLM reads ("Qwen2Tokenizer has no attribute
    # all_special_tokens_extended"), and the tokenizer of Mistral's models
    # (mistral_common 1.10 or newer) needs huggingface_hub 1.0 or newer,
    # which transformers 4 does not allow.
    "transformers>=5.5.1",
    # config.py reads and validates the configuration file itself.
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    # Progress bars and the data summary.
    "rich",
    # SynTypeEval.py.
    "matplotlib",
    "scikit-learn",
    "seaborn"
]

[project.urls]
Repository = "https://github.com/Goldkugel/syntype"

[tool.setuptools]
packages = ["syntype"]

[tool.setuptools.package-dir]
"syntype" = "src"

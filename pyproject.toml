[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntype"
description = "Classifies the source type of Human Phenotype Ontology concepts' synonyms."
readme = "README.md"
version = "1.2.0"
# model and embedder require Python 3.10.
requires-python = ">=3.10"
authors = [{ name = "Peter Pallaoro", email = "peter.pallaoro@tum.de" }]
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.7.0",
    "adapter @ git+https://github.com/Goldkugel/adapter.git@v1.5.2",
    "embedder @ git+https://github.com/Goldkugel/embedder.git@v2.3.1",
    "model @ git+https://github.com/Goldkugel/model.git@v3.2.1",
    # Below 5: transformers 5 removed tokenizer attributes vLLM reads when it
    # loads a model ("Qwen2Tokenizer has no attribute
    # all_special_tokens_extended").
    "transformers>=4.45,<5",
    # config.py reads and validates the configuration file itself.
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    # Progress bars and the data summary.
    "rich",
    # SynTypeEval.py.
    "matplotlib",
    "scikit-learn",
    "seaborn"
]

[project.urls]
Repository = "https://github.com/Goldkugel/syntype"

[tool.setuptools]
packages = ["syntype"]

[tool.setuptools.package-dir]
"syntype" = "src"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntype"
description = "Classifies the source type of Human Phenotype Ontology concepts' synonyms."
readme = "README.md"
version = "0.1.0"
# model and embedder require Python 3.10.
requires-python = ">=3.10"
authors = [{ name = "Peter Pallaoro", email = "peter.pallaoro@tum.de" }]
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.4.0",
    "adapter @ git+https://github.com/Goldkugel/adapter.git@v1.3.1",
    "embedder @ git+https://github.com/Goldkugel/embedder.git@v2.2.2",
    "model @ git+https://github.com/Goldkugel/model.git@v2.1.1",
    # config.py reads and validates the configuration file itself.
    "pydantic>=2",
    "pyyaml",
    "numpy",
    "pandas",
    # Progress bars and the data summary.
    "rich",
    # syntypeeval.py.
    "matplotlib",
    "scikit-learn",
    "seaborn"
]

[project.urls]
Repository = "https://github.com/Goldkugel/syntype"

[tool.setuptools]
packages = ["syntype"]

[tool.setuptools.package-dir]
"syntype" = "src"

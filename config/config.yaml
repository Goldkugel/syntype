# Paths are relative to the repository root, from where the scripts are run
# (e.g. ./start.sh, python3 ./src/SynTypeClassification.py).
syntype:
  # The experiments, picked by their index (counted from 0): start.sh starts
  # one classification job per experiment, finalize.sh merges and evaluates
  # every one of them. Settings of an experiment: test (only the test
  # concepts), few_shot, chain_of_thoughts, definition, comment and structure
  # (the parents and children of a concept); a setting that is not given is
  # off.
  experiments:
    - {test: True, few_shot: True}
    - {test: True, few_shot: True, definition: True}
    - {test: True, few_shot: True, definition: True, structure: True}
    - {test: True, few_shot: True, definition: True, comment: True, structure: True}
    - {test: True, few_shot: True, definition: True, comment: True}
  data_folder: "./data"
  # Mean and standard deviation of the cosine distance (SapBERT) between
  # every synonym and the label of its concept, over all synonyms of HPO.
  # The distances are normalised with them, (distance - mean) / std, so that
  # every run uses the same scale; normalised distances can be below -1 and
  # above 1. 0 and 1 leave them as they are; null computes them from the
  # data. The evaluation plots show the normalised distances from
  # distance_evaluation_lower_bound to _upper_bound.
  cosine_distance_mean: 0
  cosine_distance_std: 1
  distance_evaluation_lower_bound: -4
  distance_evaluation_upper_bound: 4
  force_draw_additional_plots: False
adapter:
  hpo:
    input_folder: "./data/input/"
    input_files:
      - "hp.owl"
    # SynTypeClassification.py writes its own files (see config.py); these
    # two are only used by HPOAdapter.to_csv(), which syntype does not call.
    output_folder: "./data/output/transformed/"
    output_file: "hpo.csv"
    skip_if_present: False
    prefix: ""
logger:
  folder: "./data/logs/"
  # One log file per run, named after its start ({start}, to the
  # microsecond, so that runs started at the same time get their own file);
  # the packages log into the same file. The first line is the command line
  # of the run.
  file_name: "syntype_{start:%Y%m%d_%H%M%S_%f}.log"
  header_char: "="
  header_length: 60
  log_runtime: True
  format: "%Y-%m-%d %H:%M:%S"
  encoding: "utf-8"
llm:
  # The models of SynTypeClassification.py, classifying one after the other; a
  # model ID after the experiment index on the command line classifies with
  # only that model. SynTypeClassification.py loads a model by its index in
  # this list.
  model_id:
    - "google/medgemma-4b-it"
    - "Qwen/Qwen3-4B-Instruct-2507"
    - "mistralai/Mistral-7B-Instruct-v0.2"
    - "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
    - "google/medgemma-27b-text-it"
    - "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
  device: "cuda"
  expert_parallel_models:
    - "Qwen3-30B"
  seed: 2898231092
  temperature: 0.01
  top_p: 0.95
  max_model_len: 8192
  max_num_batched_tokens: 16384
  # CUDA graphs, as vLLM used them before the switch to the model package.
  enforce_eager: false
  gpu_memory_utilization: 0.9
  dtype: "auto"
  quantization: null
  enable_prefix_caching: true
  enable_thinking: null
  reasoning_start_tag: "<think>"
  reasoning_end_tag: "</think>"
  max_tokens: 2048
  chunk_size: 500
  # Folder of the prompt templates and the templates, used by their index:
  # 0 is the single prompt, 1 to 3 are the chain-of-thoughts prompts, one
  # per turn.
  prompt_folder: "./prompts/"
  prompt_files: 
    - "single_prompt.md"
    - "multiple_prompt1.md"
    - "multiple_prompt2.md"
    - "multiple_prompt3.md"
  # The answer store (the checkpoint: the prompts and answers of a model in a
  # JSON file) and the prompt log. The model package adds the model name and
  # the experiment (SynTypeClassification.py sets it as postfix) to their
  # names, e.g. syntype_medgemma-4b-it_Test_..._FewShot.json, since start.sh
  # starts many runs at the same time.
  prompt_tmp_folder: "./data/tmp/"
  prompt_tmp_file: "syntype.json"
  prompt_log_folder: "./data/logs/"
  prompt_log_file: "prompts.log"
  metadata_folder: "./data/logs/"
  metadata_file: "run_metadata.json"
embedder:
  # The preparation run (SynTypeClassification.py) embeds with one model after
  # the other; a model is named in the distance columns by
  # syntype.embedding_model_names, or by its ID without the organisation.
  model_id:
    - "cambridgeltl/SapBERT-from-PubMedBERT-fulltext"
  # The commit of every model on the Hugging Face Hub (as of 2026-11-03), so
  # that the cache never serves vectors of another model version. Update a
  # commit to use a newer model; its cache file then starts anew.
  revision:
    "cambridgeltl/SapBERT-from-PubMedBERT-fulltext": "090663c3ae57bf35ffe4d0d468a2a88d03051a4d"
  # CLS pooling, as SapBERT was trained with, over at most 64 tokens; vectors
  # not normalised.
  pooling: "cls"
  max_seq_length: 64
  normalization: False
  # Lowercases only for uncased models, whose tokenizer lowercases anyway.
  lowercase: "auto"
  device: "cpu"
  backend: "torch"
  batch_size: 128
  # One file per model with the embedding of every term:
  # SynTypeClassification.py only encodes terms that are not in it yet (e.g.
  # after an HPO update), and an interrupted run resumes from it. About
  # 0.6-0.8 GB per model.
  cache_folder: "./data/cache/embeddings/"
  dimensionality_reduction: False
